<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antfarm Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono&display=swap" rel="stylesheet">
<link href="output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-bg-page dark:bg-dark-bg-page text-text-primary dark:text-dark-text-primary">
<header class="flex flex-wrap items-center gap-4 px-6 py-3 border-b-2 bg-header-bg dark:bg-dark-header-bg border-header-border dark:border-dark-header-border">
  <h1 class="text-xl font-semibold text-white tracking-normal"><span class="text-accent-highlight dark:text-dark-accent-highlight">antfarm</span> dashboard</h1>
  <select id="wf-select" class="rounded-md px-3 py-1.5 text-sm text-white cursor-pointer border focus:outline-none focus:ring-2 focus:ring-accent-highlight focus:ring-offset-2 transition-colors bg-header-select-bg dark:bg-dark-header-select-bg border-header-select-border dark:border-dark-header-select-border" aria-label="Select workflow"><option value="">Loading...</option></select>
  <button class="border border-white/20 rounded-md text-white cursor-pointer px-2 py-1 text-base leading-none transition-colors hover:border-white/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:ring-offset-2 bg-transparent" id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">☀️</button>
  <div class="flex items-center gap-1.5 text-xs text-white/85 cursor-pointer px-2.5 py-1 border border-white/15 rounded-md bg-transparent transition-all hover:border-white/40 hover:bg-white/5 focus:outline-none focus:ring-2 focus:ring-white/50 focus:ring-offset-2" id="medic-badge" onclick="toggleMedicPanel()" onkeydown="if(event.key==='Enter'||event.key===' ')toggleMedicPanel()" tabindex="0" role="button" aria-label="Open medic panel" title="Medic watchdog status">
    <span class="w-2 h-2 rounded-full shrink-0" id="medic-dot"></span>
    <span id="medic-label">Medic</span>
  </div>
  <span class="text-xs ml-auto" style="color:rgba(255,255,255,.6)" id="refresh-note">Auto-refresh: 30s</span>
</header>
<div class="flex flex-col md:flex-row gap-4 p-6 overflow-x-auto" style="min-height:calc(100vh - 65px)" id="board"><div class="empty m-auto text-text-secondary dark:text-dark-text-secondary text-sm text-center py-8 px-4 max-w-md"><div class="text-3xl mb-2">📋</div><div class="font-medium mb-1">No Workflow Selected</div><div class="text-xs">Choose a workflow from the dropdown above to view runs</div></div></div>
<div class="fixed top-[60px] right-4 w-[340px] max-h-[500px] rounded-[10px] border z-[50] overflow-hidden hidden flex-col medic-panel bg-bg-surface dark:bg-dark-bg-surface border-border-default dark:border-dark-border-default shadow-heavy dark:shadow-dark-heavy" id="medic-panel">
  <div class="px-4 py-3.5 border-b text-sm font-semibold flex items-center gap-2 border-border-light dark:border-dark-border-light text-text-primary dark:text-dark-text-primary">Workflow Medic</div>
  <div class="px-4 py-3 overflow-y-auto flex-1" id="medic-panel-body">Loading...</div>
</div>
<div class="fixed inset-0 z-[100] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-150 overlay bg-overlay dark:bg-dark-overlay" id="overlay" onclick="if(event.target===this)closePanel()">
  <div class="relative w-[90%] max-w-[640px] max-h-[85vh] overflow-y-auto p-6 rounded-xl border bg-bg-surface dark:bg-dark-bg-surface border-border-default dark:border-dark-border-default shadow-heavy dark:shadow-dark-heavy" id="panel"></div>
</div>

<script>
const API = '';
let workflows = [];
let currentWf = null;

// Badge helper - returns Tailwind classes for status badges with dark mode support
function getBadgeClasses(status) {
  const baseClasses = 'text-[10px] font-semibold px-1.5 py-0.5 rounded uppercase';
  const statusMap = {
    'running': 'bg-accent-teal-subtle dark:bg-dark-accent-teal-subtle text-accent-teal dark:text-dark-accent-teal',
    'done': 'bg-accent-green-subtle dark:bg-dark-accent-green-subtle text-accent-green dark:text-dark-accent-green',
    'completed': 'bg-accent-green-subtle dark:bg-dark-accent-green-subtle text-accent-green dark:text-dark-accent-green',
    'failed': 'bg-accent-orange-subtle dark:bg-dark-accent-orange-subtle text-accent-orange dark:text-dark-accent-orange',
    'error': 'bg-accent-orange-subtle dark:bg-dark-accent-orange-subtle text-accent-orange dark:text-dark-accent-orange',
    'waiting': 'bg-accent-muted dark:bg-dark-accent-muted text-text-secondary dark:text-dark-text-secondary',
    'pending': 'bg-accent-muted dark:bg-dark-accent-muted text-text-secondary dark:text-dark-text-secondary',
    'blocked': 'bg-accent-orange-faint-light dark:bg-accent-orange-faint-dark text-accent-orange dark:text-dark-accent-orange'
  };
  const statusClasses = statusMap[status] || statusMap['pending'];
  return {
    classes: `${baseClasses} ${statusClasses}`,
    style: '' // No inline styles needed with Tailwind
  };
}

// Step icon helper - returns Tailwind classes for step icon status colors with dark mode support
function getStepIconClasses(status) {
  const statusMap = {
    'done': 'bg-accent-green-subtle dark:bg-dark-accent-green-subtle text-accent-green dark:text-dark-accent-green',
    'running': 'bg-accent-teal-subtle dark:bg-dark-accent-teal-subtle text-accent-teal dark:text-dark-accent-teal',
    'pending': 'bg-accent-muted dark:bg-dark-accent-muted text-text-secondary dark:text-dark-text-secondary',
    'waiting': 'bg-accent-muted dark:bg-dark-accent-muted text-text-secondary dark:text-dark-text-secondary',
    'failed': 'bg-accent-orange-subtle dark:bg-dark-accent-orange-subtle text-accent-orange dark:text-dark-accent-orange',
    'error': 'bg-accent-orange-subtle dark:bg-dark-accent-orange-subtle text-accent-orange dark:text-dark-accent-orange'
  };
  return statusMap[status] || statusMap['pending'];
}

async function fetchJSON(url) {
  const r = await fetch(API + url);
  return r.json();
}

async function loadWorkflows() {
  workflows = await fetchJSON('/api/workflows');
  const sel = document.getElementById('wf-select');
  sel.innerHTML = '<option value="">— select workflow —</option>' +
    workflows.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
  if (workflows.length === 1) {
    sel.value = workflows[0].id;
    selectWorkflow(workflows[0].id);
  } else if (workflows.length > 1) {
    // Auto-select workflow with active runs
    try {
      for (const w of workflows) {
        const runs = await fetchJSON(`/api/runs?workflow=${w.id}`);
        const active = runs.find(r => r.status === 'running' || r.status === 'pending');
        if (active) { sel.value = w.id; selectWorkflow(w.id); break; }
      }
    } catch {}
  }
}

function selectWorkflow(id) {
  currentWf = workflows.find(w => w.id === id) || null;
  if (currentWf) loadRuns();
  else document.getElementById('board').innerHTML = '<div class="m-auto text-text-secondary dark:text-dark-text-secondary text-sm text-center py-8 px-4 max-w-md"><div class="text-3xl mb-2">📋</div><div class="font-medium mb-1">No Workflow Selected</div><div class="text-xs">Choose a workflow from the dropdown above to view runs</div></div>';
}

async function loadRuns() {
  if (!currentWf) return;
  const runs = await fetchJSON(`/api/runs?workflow=${currentWf.id}`);
  renderBoard(currentWf, runs);
}

function getActiveStepId(run) {
  if (!run.steps || !run.steps.length) return null;
  const active = run.steps.find(s => s.status !== 'done' && s.status !== 'skipped');
  return active ? active.step_id : run.steps[run.steps.length - 1].step_id;
}

function renderBoard(wf, runs) {
  const board = document.getElementById('board');
  const columns = {};
  wf.steps.forEach(s => { columns[s.id] = []; });

  runs.forEach(run => {
    const stepId = getActiveStepId(run);
    const col = stepId && columns[stepId] !== undefined ? stepId : wf.steps[wf.steps.length - 1]?.id;
    if (col && columns[col]) columns[col].push(run);
  });

  board.innerHTML = wf.steps.map(step => {
    const cards = columns[step.id];
    const cardHTML = cards.length === 0
      ? '<div class="text-text-secondary dark:text-dark-text-secondary text-xs text-center py-8 px-4"><div class="text-2xl mb-2 opacity-50">∅</div><div>No runs in this stage</div></div>'
      : cards.map(run => {
          const isDone = run.status === 'done';
          const isFailed = run.status === 'failed' || run.status === 'error';
          const badgeInfo = getBadgeClasses(run.status);
          const time = run.updated_at ? parseTS(run.updated_at)?.toLocaleString() || "" : '';
          const title = run.task.length > 60 ? run.task.slice(0, 57) + '…' : run.task;
          const borderLeft = isDone ? 'border-l-[3px] border-l-accent-green dark:border-l-dark-accent-green' : isFailed ? 'border-l-[3px] border-l-accent-orange dark:border-l-dark-accent-orange' : '';
          return `<div class="rounded-md border p-3 cursor-pointer transition-all duration-200 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-accent-highlight focus:ring-offset-2 bg-bg-surface-alt dark:bg-dark-bg-surface-alt border-border-default dark:border-dark-border-default ${borderLeft}" onclick="openRun('${run.id}')" onkeydown="if(event.key==='Enter')openRun('${run.id}')" tabindex="0" role="button" aria-label="Open run: ${run.task.replace(/"/g, '&quot;')}" onmouseenter="this.style.borderColor='var(--accent-orange)'" onmouseleave="this.classList.remove('border-accent-orange');this.classList.remove('dark:border-dark-accent-orange')">
            <div class="text-[13px] font-medium mb-1.5 overflow-hidden text-ellipsis whitespace-nowrap text-text-primary dark:text-dark-text-primary" title="${run.task.replace(/"/g, '&quot;')}">${title}</div>
            <div class="text-[11px] flex justify-between items-center text-text-secondary dark:text-dark-text-secondary">
              <span class="${badgeInfo.classes}" style="${badgeInfo.style}">${run.status}</span>
              <span>${time}</span>
            </div>
          </div>`;
        }).join('');
    return `<div class="min-w-[240px] flex-1 rounded-lg flex flex-col bg-bg-surface dark:bg-dark-bg-surface shadow-light dark:shadow-dark-light">
      <div class="px-4 py-3 border-b text-xs font-semibold uppercase tracking-wider rounded-t-lg text-accent-green dark:text-dark-accent-green bg-bg-column-header dark:bg-dark-bg-column-header border-border-light dark:border-dark-border-light">${step.id}<span class="inline-block text-white rounded-full px-2 py-0.5 text-[11px] ml-2 bg-accent-green dark:bg-dark-accent-green">${cards.length}</span></div>
      <div class="p-2 flex-1 flex flex-col gap-2 overflow-y-auto">${cardHTML}</div>
    </div>`;
  }).join('');
}

const stepIcons = {done:'✓',running:'●',pending:'○',waiting:'◌',failed:'✗',error:'✗'};
function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Normalize SQLite datetime('now') format (no T/Z) to proper ISO 8601 UTC
function parseTS(ts) { if (!ts) return null; if (!ts.endsWith('Z') && !ts.includes('+')) ts = ts.replace(' ', 'T') + 'Z'; return new Date(ts); }

async function openRun(id) {
  const run = await fetchJSON(`/api/runs/${id}`);
  const panel = document.getElementById('panel');
  const created = run.created_at ? parseTS(run.created_at)?.toLocaleString() || "" : '';
  const updated = run.updated_at ? parseTS(run.updated_at)?.toLocaleString() || "" : '';
  const stepsHTML = (run.steps || []).map(s => {
    const st = s.status || 'waiting';
    const icon = stepIcons[st] || '○';
    const badgeInfo = getBadgeClasses(st);
    const iconClasses = getStepIconClasses(st);
    const hasOutput = !!s.output;
    const toggleAttr = hasOutput ? `onclick="this.querySelector('.step-details').classList.toggle('step-open');this.querySelector('.step-chevron').classList.toggle('step-chevron-open')" style="cursor:pointer"` : '';
    return `<div class="flex flex-col overflow-hidden rounded-md border p-3 bg-bg-surface-alt dark:bg-dark-bg-surface-alt border-border-default dark:border-dark-border-default" ${toggleAttr}>
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs shrink-0 ${iconClasses}">${icon}</div>
        <div class="text-[13px] font-medium flex-1 text-text-primary dark:text-dark-text-primary">${s.step_id}</div>
        <div class="text-[11px] font-mono text-text-secondary dark:text-dark-text-secondary">${s.agent_id || ''}</div>
        <div class="text-[11px] uppercase font-semibold"><span class="${badgeInfo.classes}">${st}</span></div>
        ${hasOutput ? '<span class="step-chevron inline-block text-[10px] transition-transform duration-150 text-text-secondary dark:text-dark-text-secondary">▶</span>' : ''}
      </div>
      ${hasOutput ? `<div class="step-details hidden pt-0 pl-9 pb-0 pr-3 text-xs leading-relaxed text-text-tertiary dark:text-dark-text-tertiary">
        <details class="mt-1" onclick="event.stopPropagation()"><summary class="text-[11px] font-medium cursor-pointer text-text-secondary dark:text-dark-text-secondary">Output</summary><pre class="mt-1.5 p-2 rounded border text-[11px] font-mono whitespace-pre-wrap break-words max-h-[300px] overflow-y-auto bg-bg-code dark:bg-dark-bg-code border-border-default dark:border-dark-border-default">${esc(s.output)}</pre></details>
      </div>` : ''}
    </div>`;
  }).join('');
  const runBadgeInfo = getBadgeClasses(run.status);
  panel.innerHTML = `
    <button class="absolute top-3 right-4 bg-transparent border-none text-xl cursor-pointer px-2 py-1 rounded transition-colors text-text-secondary dark:text-dark-text-secondary hover:text-text-primary hover:dark:text-dark-text-primary hover:bg-bg-column-header hover:dark:bg-dark-bg-column-header" onclick="closePanel()">✕</button>
    <h2 class="text-base font-semibold mb-1 pr-10 text-text-primary dark:text-dark-text-primary">${run.workflow_id}</h2>
    <div class="text-[13px] mb-4 whitespace-pre-wrap break-words max-h-[120px] overflow-y-auto leading-normal text-text-secondary dark:text-dark-text-secondary">${esc(run.task)}</div>
    <div class="flex gap-3 mb-5 text-xs flex-wrap text-text-secondary dark:text-dark-text-secondary">
      <span class="flex items-center gap-1"><span class="${runBadgeInfo.classes}">${run.status}</span></span>
      <span class="flex items-center gap-1">Created: ${created}</span>
      <span class="flex items-center gap-1">Updated: ${updated}</span>
    </div>
    <div class="flex flex-col gap-2">${stepsHTML}</div>
    <div id="stories-panel"></div>
    <div id="activity-panel"></div>
  `;
  document.getElementById('overlay').classList.add('open');
  loadStories(id);
  loadActivity(id);
}

function formatEventDesc(evt) {
  const e = evt.event;
  const story = evt.storyTitle ? `${evt.storyId}: "${evt.storyTitle}"` : evt.storyId || '';
  switch (e) {
    case 'run.started': return 'Run started';
    case 'run.completed': return 'Run completed ✅';
    case 'run.failed': return 'Run failed ❌';
    case 'step.pending': return `Step pending`;
    case 'step.running': return `Claimed step`;
    case 'step.done': return `Step completed`;
    case 'step.failed': return `Step failed` + (evt.detail ? `: ${evt.detail.slice(0,80)}` : '');
    case 'step.timeout': return `Step timed out` + (evt.detail ? ` — ${evt.detail}` : '');
    case 'story.started': return `Claimed story ${story}`;
    case 'story.done': return `Completed ${story}`;
    case 'story.verified': return `Verified ${story} ✅`;
    case 'story.retry': return `Retry ${story}` + (evt.detail ? ` — ${evt.detail.slice(0,80)}` : '');
    case 'story.failed': return `Story failed ${story}`;
    case 'pipeline.advanced': return `Pipeline advanced`;
    default: return e;
  }
}

async function loadActivity(runId) {
  const events = await fetchJSON(`/api/runs/${runId}/events`);
  const panel = document.getElementById('activity-panel');
  if (!events || events.length === 0) { panel.innerHTML = ''; return; }
  const rows = events.map(evt => {
    const t = parseTS(evt.ts);
    const time = t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const agent = evt.agentId ? evt.agentId.split('/').pop() : '';
    const desc = formatEventDesc(evt);
    const agentSpan = agent
      ? `<span class="font-mono shrink-0 text-accent-teal dark:text-dark-accent-teal">${esc(agent)}</span>`
      : '';
    return `<div class="flex gap-3 py-1 text-xs leading-normal border-b border-border-light dark:border-dark-border-light">
      <span class="font-mono shrink-0 min-w-[44px] text-text-secondary dark:text-dark-text-secondary">${time}</span>
      ${agentSpan}
      <span class="text-text-primary dark:text-dark-text-primary">${esc(desc)}</span>
    </div>`;
  }).join('');
  panel.innerHTML = `
    <div class="mt-6 border-t pt-5 border-border-default dark:border-dark-border-default">
      <h3 class="text-[15px] font-semibold mb-3 text-text-primary dark:text-dark-text-primary">Activity</h3>
      <div class="max-h-[300px] overflow-y-auto">${rows}</div>
    </div>
  `;
}

function closePanel() {
  document.getElementById('overlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

async function loadStories(runId) {
  const stories = await fetchJSON(`/api/runs/${runId}/stories`);
  const panel = document.getElementById('stories-panel');
  if (!stories || stories.length === 0) { panel.innerHTML = ''; return; }
  const done = stories.filter(s => s.status === 'done').length;
  const pct = Math.round((done / stories.length) * 100);
  panel.innerHTML = `
    <div class="mt-6 border-t pt-5 border-border-default dark:border-dark-border-default">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-[15px] font-semibold text-text-primary dark:text-dark-text-primary">Stories</h3>
        <span class="text-[13px] font-semibold text-accent-green dark:text-dark-accent-green">${done} / ${stories.length} done</span>
      </div>
      <div class="rounded h-2 mb-4 overflow-hidden bg-accent-muted dark:bg-dark-accent-muted">
        <div class="h-full rounded transition-[width] duration-300 bg-accent-green dark:bg-dark-accent-green" style="width:${pct}%"></div>
      </div>
      <div class="flex flex-col gap-1.5">
        ${stories.map((s, i) => {
          const st = s.status || 'pending';
          const icon = stepIcons[st] || '○';
          const badgeInfo = getBadgeClasses(st);
          const iconClasses = getStepIconClasses(st);
          let ac = [];
          try { ac = JSON.parse(s.acceptance_criteria || '[]'); } catch { ac = [s.acceptance_criteria]; }
          const retryInfo = s.retry_count > 0 ? ` <span class="text-[10px] text-accent-orange dark:text-dark-accent-orange">(retry ${s.retry_count})</span>` : '';
          const hasDetails = s.description || ac.length > 0 || s.output;
          const toggleAttr = hasDetails ? `onclick="this.querySelector('.story-details').classList.toggle('story-open');this.querySelector('.story-chevron').classList.toggle('story-chevron-open')" style="cursor:pointer"` : '';
          const checkColor = st === 'done' ? 'text-accent-green dark:text-dark-accent-green' : 'text-border-default dark:text-dark-border-default';
          return `<div class="flex flex-col overflow-hidden rounded-md border p-3 bg-bg-surface-alt dark:bg-dark-bg-surface-alt border-border-default dark:border-dark-border-default" ${toggleAttr}>
            <div class="flex items-center gap-3">
              <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs shrink-0 ${iconClasses}">${icon}</div>
              <div class="text-[13px] font-medium flex-1 text-text-primary dark:text-dark-text-primary">${s.story_id}: ${s.title}${retryInfo}</div>
              <div class="text-[11px] uppercase font-semibold"><span class="${badgeInfo.classes}">${st}</span></div>
              ${hasDetails ? '<span class="story-chevron inline-block text-[10px] transition-transform duration-150 text-text-secondary dark:text-dark-text-secondary">▶</span>' : ''}
            </div>
            ${hasDetails ? `<div class="story-details hidden pt-0 pl-9 pb-0 pr-3 text-xs leading-relaxed text-text-tertiary dark:text-dark-text-tertiary">
              ${s.description ? `<div class="mb-2">${esc(s.description)}</div>` : ''}
              ${ac.length > 0 ? `<div class="mb-2"><div class="font-semibold text-[11px] uppercase tracking-wide mb-1 text-accent-green dark:text-dark-accent-green">Acceptance Criteria</div>${ac.map(c => `<label class="flex items-start gap-1.5 mb-0.5 cursor-default"><span class="shrink-0 ${checkColor}">${st==='done'?'☑':'☐'}</span><span>${esc(c)}</span></label>`).join('')}</div>` : ''}
              ${s.output ? `<details class="mt-1" onclick="event.stopPropagation()"><summary class="text-[11px] font-medium cursor-pointer text-text-secondary dark:text-dark-text-secondary">Output</summary><pre class="mt-1.5 p-2 rounded border text-[11px] font-mono whitespace-pre-wrap break-words max-h-[200px] overflow-y-auto bg-bg-code dark:bg-dark-bg-code border-border-default dark:border-dark-border-default">${esc(s.output)}</pre></details>` : ''}
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

document.getElementById('wf-select').addEventListener('change', e => selectWorkflow(e.target.value));
loadWorkflows();
setInterval(() => { if (currentWf) loadRuns(); }, 30000);

// ── Medic ───────────────────────────────────────────────────────
let medicPanelOpen = false;

function toggleMedicPanel() {
  medicPanelOpen = !medicPanelOpen;
  document.getElementById('medic-panel').classList.toggle('open', medicPanelOpen);
  if (medicPanelOpen) loadMedicData();
}

document.addEventListener('click', e => {
  if (!medicPanelOpen) return;
  const panel = document.getElementById('medic-panel');
  const badge = document.getElementById('medic-badge');
  if (!panel.contains(e.target) && !badge.contains(e.target)) {
    medicPanelOpen = false;
    panel.classList.remove('open');
  }
});

async function loadMedicStatus() {
  try {
    const status = await fetchJSON('/api/medic/status');
    const dot = document.getElementById('medic-dot');
    const label = document.getElementById('medic-label');

    // Remove all status classes
    dot.classList.remove('unknown', 'healthy', 'warning', 'critical');

    if (!status.installed || !status.lastCheck) {
      dot.classList.add('unknown');
      label.textContent = 'Medic';
      return;
    }

    const ageMin = Math.round((Date.now() - parseTS(status.lastCheck.checkedAt).getTime()) / 60000);
    const hasIssues = status.lastCheck.issuesFound > 0;
    const isStale = ageMin > 10;

    if (hasIssues && status.lastCheck.actionsTaken < status.lastCheck.issuesFound) {
      dot.classList.add('critical');
      label.textContent = `${status.lastCheck.issuesFound} issue(s)`;
    } else if (isStale) {
      dot.classList.add('warning');
      label.textContent = `${ageMin}m ago`;
    } else if (hasIssues) {
      dot.classList.add('warning');
      label.textContent = `${status.lastCheck.issuesFound} fixed`;
    } else {
      dot.classList.add('healthy');
      label.textContent = `${ageMin}m ago`;
    }
  } catch {
    const dot = document.getElementById('medic-dot');
    dot.classList.remove('unknown', 'healthy', 'warning', 'critical');
    dot.classList.add('unknown');
    document.getElementById('medic-label').textContent = 'Medic';
  }
}

async function loadMedicData() {
  const body = document.getElementById('medic-panel-body');
  try {
    const [status, checks] = await Promise.all([
      fetchJSON('/api/medic/status'),
      fetchJSON('/api/medic/checks?limit=10'),
    ]);

    let html = '';
    html += '<div class="mb-3">';
    if (status.lastCheck) {
      const ageMin = Math.round((Date.now() - parseTS(status.lastCheck.checkedAt).getTime()) / 60000);
      html += `<div class="flex justify-between py-1.5 text-xs border-b text-text-secondary dark:text-dark-text-secondary border-border-light dark:border-dark-border-light"><span>Last check</span><span class="font-semibold text-text-primary dark:text-dark-text-primary">${ageMin}m ago</span></div>`;
      html += `<div class="flex justify-between py-1.5 text-xs border-b text-text-secondary dark:text-dark-text-secondary border-border-light dark:border-dark-border-light"><span>Result</span><span class="font-semibold text-text-primary dark:text-dark-text-primary">${esc(status.lastCheck.summary)}</span></div>`;
    } else {
      html += '<div class="flex justify-between py-1.5 text-xs border-b text-text-secondary dark:text-dark-text-secondary border-border-light dark:border-dark-border-light"><span>Last check</span><span class="font-semibold text-text-primary dark:text-dark-text-primary">Never</span></div>';
    }
    html += `<div class="flex justify-between py-1.5 text-xs border-b text-text-secondary dark:text-dark-text-secondary border-border-light dark:border-dark-border-light"><span>Checks (24h)</span><span class="font-semibold text-text-primary dark:text-dark-text-primary">${status.recentChecks}</span></div>`;
    html += `<div class="flex justify-between py-1.5 text-xs border-b text-text-secondary dark:text-dark-text-secondary border-border-light dark:border-dark-border-light"><span>Issues found (24h)</span><span class="font-semibold text-text-primary dark:text-dark-text-primary">${status.recentIssues}</span></div>`;
    html += `<div class="flex justify-between py-1.5 text-xs text-text-secondary dark:text-dark-text-secondary"><span>Auto-fixed (24h)</span><span class="font-semibold text-text-primary dark:text-dark-text-primary">${status.recentActions}</span></div>`;
    html += '</div>';

    if (checks.length > 0) {
      html += '<div class="text-xs font-semibold mb-2 text-text-primary dark:text-dark-text-primary">Recent Checks</div>';
      for (const c of checks) {
        const t = parseTS(c.checkedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        const icon = c.issuesFound === 0 ? '·' : c.actionsTaken > 0 ? '~' : '!';
        const colorClass = c.issuesFound === 0 ? 'text-text-secondary dark:text-dark-text-secondary' : c.actionsTaken >= c.issuesFound ? 'text-accent-teal dark:text-dark-accent-teal' : 'text-accent-orange dark:text-dark-accent-orange';
        const borderClass = checks.indexOf(c) === checks.length - 1 ? '' : 'border-b border-border-light dark:border-dark-border-light';
        html += `<div class="py-2 text-[11px] leading-normal ${borderClass}">
          <span class="font-mono text-text-secondary dark:text-dark-text-secondary">${t}</span>
          <span class="ml-2 ${colorClass}">${icon} ${esc(c.summary)}</span>
        </div>`;
      }
    }

    body.innerHTML = html || '<div class="text-xs py-2 text-text-secondary dark:text-dark-text-secondary">No medic data yet. Run <code>antfarm medic install</code> to enable.</div>';
  } catch {
    body.innerHTML = '<div class="text-xs py-2 text-text-secondary dark:text-dark-text-secondary">Could not load medic data.</div>';
  }
}

loadMedicStatus();
setInterval(loadMedicStatus, 30000);

// ── Theme toggle ──────────────────────────────────────────────────
(function initTheme() {
  const btn = document.getElementById('theme-toggle');
  const root = document.documentElement;
  const STORAGE_KEY = 'antfarm-theme';

  function getEffectiveTheme() {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    btn.textContent = theme === 'dark' ? '🌙' : '☀️';
    btn.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
  }

  applyTheme(getEffectiveTheme());

  btn.addEventListener('click', () => {
    const current = root.getAttribute('data-theme') || getEffectiveTheme();
    const next = current === 'dark' ? 'light' : 'dark';
    localStorage.setItem(STORAGE_KEY, next);
    applyTheme(next);
  });

  // Update if system preference changes and no manual override
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!localStorage.getItem(STORAGE_KEY)) applyTheme(getEffectiveTheme());
  });
})();
</script>
