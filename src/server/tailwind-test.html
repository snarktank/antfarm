<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind CSS Test</title>
  <link href="/output.css" rel="stylesheet">
</head>
<body class="bg-gray-100 dark:bg-gray-900">
  <div class="container mx-auto p-8">
    <h1 class="text-4xl font-bold text-blue-600 dark:text-blue-400 mb-4">
      Tailwind CSS Test
    </h1>
    <p class="text-gray-700 dark:text-gray-300 mb-4">
      This is a test page to verify Tailwind CSS is working correctly.
    </p>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-2">Card 1</h2>
        <p class="text-gray-600 dark:text-gray-400">Responsive grid layout</p>
      </div>
      <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-2">Card 2</h2>
        <p class="text-gray-600 dark:text-gray-400">Dark mode support</p>
      </div>
      <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
        <h2 class="text-xl font-semibold text-gray-900 dark:text-white mb-2">Card 3</h2>
        <p class="text-gray-600 dark:text-gray-400">Utility classes</p>
      </div>
    </div>
    
    <button class="mt-6 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition duration-200">
      Test Button
    </button>
    
    <div class="mt-6 p-4 bg-green-100 dark:bg-green-900 border-l-4 border-green-500 text-green-700 dark:text-green-200">
      <p class="font-semibold">Success!</p>
      <p>If you can see this styled correctly, Tailwind CSS is working.</p>
    </div>
  </div>
  
  <script>
    // Test dark mode toggle
    document.addEventListener('DOMContentLoaded', () => {
      const html = document.documentElement;
      console.log('Tailwind test page loaded');
      console.log('Dark mode class present:', html.classList.contains('dark'));
    });
  </script>
</body>
</html>
