# No-op test run workflow
id: test-run
name: Test Run
version: 1
description: "A no-op workflow used to verify that bundled workflows can be discovered and loaded."

agents:
  - id: noop
    name: Noop Agent
    role: testing
    workspace:
      baseDir: agents/noop
      files:
        AGENTS.md: agents/noop/AGENTS.md

steps:
  - id: run
    agent: noop
    input: |
      echo "noop"
    expects: "STATUS: done"
